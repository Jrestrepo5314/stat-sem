# En cada push a main: pruebas del servidor y del frontend, build, subida por SSH y reinicio.
# Si algo falla, no publica. Secretos necesarios en el repositorio:
#   VPS_HOST (31.97.14.5) · VPS_USER (root) · VPS_SSH_KEY (llave privada) · SITIO_URL (https://sem.jarestrepo.com)
name: desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Pruebas del servidor
        run: |
          pip install -q -r backend/requirements.txt
          cd backend && python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pruebas, tipos y build del frontend
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npx tsc -b
          npx vite build

      - name: Llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Subir
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/vps" \
            --exclude 'data/sesiones' --exclude '__pycache__' --exclude '.pytest_cache' \
            backend/app backend/scripts backend/tests backend/requirements.txt backend/data \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stat-sem/backend/"
          rsync -az --delete -e "ssh -i ~/.ssh/vps" frontend/dist "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stat-sem/frontend/"
          rsync -az -e "ssh -i ~/.ssh/vps" deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stat-sem/"

      - name: Instalar dependencias y reiniciar
        run: |
          ssh -i ~/.ssh/vps "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/stat-sem
            venv/bin/pip install -q -r backend/requirements.txt
            chown -R root:root /opt/stat-sem && chown -R statsem:statsem /opt/stat-sem/backend/data
            install -m 644 deploy/stat-sem.service /etc/systemd/system/stat-sem.service
            systemctl daemon-reload && systemctl restart stat-sem
            sleep 2 && systemctl is-active stat-sem'

      - name: Comprobar en linea
        run: |
          curl -fsS -H 'X-Cliente: actions' "${{ secrets.SITIO_URL }}/api/salud"
